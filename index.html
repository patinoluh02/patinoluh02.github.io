    <title>Heriberto Patiño Luna | Research Portfolio</title>


    <!-- Shared styling for the entire website -->
    <link rel="stylesheet" href="style.css">


    <!-- Styling used ONLY on the homepage -->
    <style>

        .home-hero {

            min-height: 78vh;

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 80px 7.5%;

            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.55),
                    rgba(15, 23, 42, 0.55)
                ),
                url("image/background.jpg");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            color: white;
        }


        .home-hero h1 {

            font-size: clamp(3rem, 6vw, 4.5rem);

            line-height: 1.1;

            margin-bottom: 15px;

            color: white;
        }


        .home-hero h2 {

            font-size: 1.6rem;

            font-weight: normal;

            color: #93c5fd;

            margin-bottom: 28px;
        }


        .home-hero p {

            max-width: 800px;

            font-size: 1.2rem;

            line-height: 1.7;

            color: white;

            margin-bottom: 0;
        }


        .home-buttons {

            margin-top: 35px;
        }


        .home-button {

            display: inline-block;

            padding: 12px 24px;

            margin-right: 12px;

            margin-bottom: 10px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }


        .home-button:hover {

            transform: translateY(-2px);
        }


        .home-primary {

            background: white;

            color: #0f172a;
        }


        .home-secondary {

            border: 1px solid white;

            color: white;

            background: rgba(15, 23, 42, 0.15);
        }


        @media (max-width: 750px) {

            .home-hero {

                min-height: 75vh;

                padding: 60px 8%;

                background-position: center center;
            }


            .home-hero h2 {

                font-size: 1.25rem;
            }


            .home-hero p {

                font-size: 1.05rem;
            }

        }

    </style>

</head>
